name: Branch API Parity Check

# packages/api is meant to be identical between `main` (deployed to Cloud
# Run) and `desktop-web` (deployed to Cloudflare Pages, but sharing the same
# backend source so EAS/mobile builds taken from that branch stay correct).
# A real production bug shipped because a backend fix landed on one branch
# and was never ported to the other. Persistent divergence is therefore a
# failure, not an informational success.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-parity:
    name: Diff packages/api between main and desktop-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff packages/api/** between branches
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main desktop-web --quiet
          if ! git diff --quiet origin/main origin/desktop-web -- packages/api/; then
            echo "## ❌ packages/api has diverged between main and desktop-web" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-status origin/main origin/desktop-web -- packages/api/ | head -200 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "packages/api differs between main and desktop-web. Reconcile the branches before treating parity as healthy."
            git diff --name-status origin/main origin/desktop-web -- packages/api/ | head -200
            exit 1
          fi
          echo "packages/api is in sync between main and desktop-web." >> "$GITHUB_STEP_SUMMARY"
