name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Typecheck, build, migrate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: venuetest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/venuetest?sslmode=disable
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/venuetest?sslmode=disable
      JWT_SECRET: ci-test-secret-not-used-in-prod-at-least-32-chars
      # S3ImageService requires these at boot (getOrThrow). The smoke test only
      # checks that the app starts and serves /api/health; no S3 calls are made,
      # so placeholder values are sufficient.
      AWS_ACCESS_KEY_ID: ci-test-access-key
      AWS_SECRET_ACCESS_KEY: ci-test-secret-key
      AWS_S3_BUCKET: ci-test-bucket

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @venue-wrangler/api

      - name: Typecheck
        run: npm run lint -w @venue-wrangler/api

      - name: Run unit tests (with coverage gate)
        run: npm test -- --coverage

      - name: Create integration test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE venuetest_integration;'

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/venuetest_integration?sslmode=disable
        run: npm run test:integration -w @venue-wrangler/api

      - name: Build
        run: npm run build -w @venue-wrangler/api

      - name: Lint post-lockdown migrations for RLS coverage
        run: |
          set -Eeuo pipefail
          # The Supabase Data API lockdown (20260805120000) enabled RLS on every
          # table that existed at the time; RLS ENABLE is per-table and is NOT
          # covered by ALTER DEFAULT PRIVILEGES, so any migration after it that
          # creates a table must enable RLS in the same migration.
          LOCKDOWN=20260805120000
          # Historical exemption: 20260808134500_ai_usage_metering created
          # AiUsageEvent without RLS; 20260808150000_harden_ai_usage_event_rls
          # enabled it shortly after. Migrations are immutable, so exempt the
          # pair's first half explicitly.
          EXEMPT=20260808134500
          for dir in packages/api/prisma/migrations/*/; do
            name="$(basename "$dir")"
            [[ "$name" > "$LOCKDOWN" ]] || continue
            [[ "$name" == "$EXEMPT"* ]] && continue
            if grep -qi 'CREATE TABLE' "$dir/migration.sql" && ! grep -qi 'ROW LEVEL SECURITY' "$dir/migration.sql"; then
              echo "::error::Migration $name creates a table without ENABLE ROW LEVEL SECURITY"
              exit 1
            fi
          done
          echo "All post-lockdown migrations with CREATE TABLE enable RLS."

      - name: Apply migrations
        run: npm run prisma:migrate:deploy -w @venue-wrangler/api

      - name: Verify critical partial indexes and open-state check
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          # Prisma cannot express partial indexes in schema.prisma. Guard the
          # production invariants that live only in SQL migrations.
          required_indexes=(
            TimeEntry_profileId_open_key
            WorkplaceJoinRequest_one_pending_per_user_venue_idx
            Invite_phone_idx
            Profile_unclaimed_venue_email_key
          )
          for index in "${required_indexes[@]}"; do
            found="$(psql -h localhost -U postgres -d venuetest -Atc \
              "SELECT 1 FROM pg_indexes WHERE indexname = '${index}'")"
            if [[ "$found" != "1" ]]; then
              echo "::error::Missing required index: ${index}"
              exit 1
            fi
            echo "✓ ${index}"
          done
          found_check="$(psql -h localhost -U postgres -d venuetest -Atc \
            "SELECT 1 FROM pg_constraint WHERE conname = 'TimeEntry_open_state_check'")"
          if [[ "$found_check" != "1" ]]; then
            echo "::error::Missing TimeEntry_open_state_check constraint"
            exit 1
          fi
          echo "✓ TimeEntry_open_state_check"

      - name: Smoke-test health endpoint
        run: |
          node packages/api/dist/main.js &
          SERVER_PID=$!
          echo "Waiting for server to start..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4000/api/health >/dev/null 2>&1; then
              echo "✓ Health check passed"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "✗ Server did not start in time"
          kill $SERVER_PID 2>/dev/null
          exit 1
