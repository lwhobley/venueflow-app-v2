name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - desktop-web
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-desktop-web:
    name: Deploy Desktop Web App (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run api:prisma:generate

      - name: Build Expo Web Bundle
        run: npx expo export --platform web

      - name: Configure Cloudflare Pages SPA Redirects
        run: echo "/*    /index.html   200" > dist/_redirects

      - name: Deploy Expo Web App to Cloudflare Pages
        run: npx -y wrangler@3 pages deploy dist --project-name venue-wrangler --branch desktop-web --commit-hash ${{ github.sha }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
