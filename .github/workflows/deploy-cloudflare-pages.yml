name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - desktop-web
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-landing:
    name: Deploy Landing Site (main)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The site/ directory is a static marketing landing page (no build step).
      - name: Deploy landing site to Cloudflare Pages
        run: npx wrangler@3.114.17 pages deploy site --project-name venue-wrangler --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-desktop-app:
    name: Deploy Desktop Web App (desktop-web)
    if: github.ref == 'refs/heads/desktop-web' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Expo Web Bundle
        run: npx expo export --platform web

      - name: Deploy Expo Web App to Cloudflare Pages
        run: npx wrangler@3.114.17 pages deploy dist --project-name venue-wrangler --branch desktop-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
